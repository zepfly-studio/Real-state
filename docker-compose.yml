services:
  db:
    image: postgres:16
    container_name: realestate_os_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: realestate_os
    ports:
      - "5433:5432"
    volumes:
      - realestate_os_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d realestate_os"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  realestate_os_data:
